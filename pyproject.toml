[project]
name = "alias-pii"
version = "0.1.0"
description = "Local PII masking before an LLM call: detect, replace with stable aliases, restore in the answer."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "lxml>=5",
    "phonenumbers>=8.13",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[dependency-groups]
bench = [
    "gliner>=0.2",
    "presidio-analyzer>=2.2",
    "protobuf>=4",
    "sentencepiece>=0.2",
    "transformers>=4.51,<5",
]
data = [
    "faker>=30",
    "httpx>=0.27",
    "pyarrow>=15",
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alias_pii"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Phrase banks are data: one sentence per item reads better than wrapped strings.
"src/alias_pii/documents.py" = ["E501"]
"src/alias_pii/phrasebank.py" = ["E501"]

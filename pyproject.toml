[project]
name = "alias-pii"
version = "0.2.0"
description = "Local PII masking before an LLM call: detect, replace with stable aliases, restore in the answer."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "lxml>=5",
    "phonenumbers>=8.13",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# The local web API (`python -m alias_pii.app`); the model itself also needs torch and
# transformers (`model` extra), which the rules-only mode and the tests do without.
app = ["fastapi>=0.115", "uvicorn>=0.30"]
model = ["torch>=2.3", "transformers>=5.10,<6"]

[dependency-groups]
bench = [
    "gliner>=0.2",
    "presidio-analyzer>=2.2",
    "protobuf>=4",
    "sentencepiece>=0.2",
    "transformers>=5.10,<6",
]
data = [
    "faker>=30",
    "httpx>=0.27",
    "pyarrow>=15",
]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
train = [
    "accelerate>=0.30",
    "datasets>=2.19",
    "torch>=2.3",
    "transformers>=5.10,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alias_pii"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Phrase banks are data: one sentence per item reads better than wrapped strings.
"src/alias_pii/documents.py" = ["E501"]
"src/alias_pii/phrasebank.py" = ["E501"]

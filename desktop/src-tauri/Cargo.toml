[package]
name = "alias-desktop"
# The app's version is the one in tauri.conf.json, set by release-please; this one stays fixed so
# the lockfile does not change with each release.
version = "0.1.0"
description = "Alias Bridge as a macOS app"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits titles, so the PR title check passes; one grouped PR per week
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
    # demo/app.js loads the same transformers.js version from jsDelivr: bump both together
    commit-message:
      prefix: "chore(deps)"

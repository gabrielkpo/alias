# Temporary: resolves the desktop app's Cargo.lock after a new dependency (no local Rust
# toolchain), then is deleted before the pull request opens.
name: Cargo lock (temporary)
on:
  push:
    branches: [fix/desktop-keychain]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add the new dependency to the lockfile, changing nothing else
        run: cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-lock
          path: desktop/src-tauri/Cargo.lock

# Builds the CPU image and checks it serves the page and masks a text, with the rules alone and
# with a tiny random model (the real weights are not public), the second time with no network
# at all: the image needs nothing from outside at run time. Built on GitHub, not on a laptop.
name: Docker
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, "src/**", pyproject.toml, .github/workflows/docker.yml]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "src/**", pyproject.toml, .github/workflows/docker.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t alias:ci .
      - name: Rules only, through the published port
        run: |
          docker run -d --name rules -p 127.0.0.1:8000:8000 alias:ci
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep -q '"detector":"rules"'
          curl -sf localhost:8000/ | grep -q '<title>Alias</title>'
          curl -sf localhost:8000/api/mask -H 'content-type: application/json' \
            -d '{"text": "Mail: jean.dupont@example.com"}' | tee answer.json
          grep -q '"masked":"Mail: \[EMAIL_1\]"' answer.json
          if grep -q 'jean.dupont' answer.json; then echo 'value in the answer'; exit 1; fi
          docker rm -f rules
      - name: Tiny random model (downloaded here, not by the image at run time)
        run: |
          mkdir -m 777 "$RUNNER_TEMP/model"
          docker run --rm -v "$RUNNER_TEMP/model:/out" -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 \
            --entrypoint python alias:ci -c "
          from transformers import AutoModelForTokenClassification, AutoTokenizer
          from alias_pii.tagging import TAG_ID, TAGS
          name = 'hf-internal-testing/tiny-random-bert'
          model = AutoModelForTokenClassification.from_pretrained(
              name, num_labels=len(TAGS), id2label=dict(enumerate(TAGS)), label2id=TAG_ID,
              ignore_mismatched_sizes=True)
          model.save_pretrained('/out'); AutoTokenizer.from_pretrained(name).save_pretrained('/out')
          "
      - name: Rules + model, without any network
        run: |
          docker run -d --name model --network none -v "$RUNNER_TEMP/model:/model:ro" alias:ci
          check='import json, sys, urllib.request as u
          for _ in range(60):
              try:
                  health = json.load(u.urlopen("http://127.0.0.1:8000/health", timeout=2)); break
              except OSError:
                  import time; time.sleep(2)
          assert health["detector"] == "rules+model", health
          request = u.Request("http://127.0.0.1:8000/api/mask", headers={"content-type": "application/json"},
                              data=json.dumps({"text": "IBAN FR76 3000 6000 0112 3456 7890 189"}).encode())
          answer = json.load(u.urlopen(request, timeout=60))
          # a random model labels random words: check the IBAN is masked and nothing of it leaks
          assert "[IBAN_1]" in answer["masked"] and "3000" not in answer["masked"], answer
          print("ok", answer["report"])'
          docker exec model python -c "$check" || { docker logs model; exit 1; }
          docker rm -f model

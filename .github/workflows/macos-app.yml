# The macOS app (desktop/, Tauri): the standalone `alias-pii` executable as the app's sidecar, the
# window, an unsigned .dmg (ad-hoc signed, Apple silicon). Built and checked on a GitHub macOS
# machine, never on a laptop: the app is launched, its bridge must answer with the published
# model, then quitting the app must stop the bridge. Called by release-please.yml when a release
# is published: built at the release tag, the checked .dmg and its SHA-256 are attached to it.
name: macOS app
on:
  pull_request:
    paths:
      - "src/alias_pii/**"
      - packaging/**
      - desktop/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/macos-app.yml
  push:
    branches: [main]
    paths:
      - "src/alias_pii/**"
      - packaging/**
      - desktop/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/macos-app.yml
  # By hand with a release tag, it rebuilds and attaches the .dmg to that release (a release whose
  # run failed); without one, it only builds and checks.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (vX.Y.Z) to attach the .dmg to; empty to only build and check
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        description: Release to build at and attach the .dmg to (vX.Y.Z)
        type: string
        required: true
permissions:
  contents: read
jobs:
  macos-app:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: The bridge as one executable (the app's sidecar)
        run: |
          uv sync --frozen --no-dev --extra serve --group bundle --python 3.12
          uv run --frozen pyinstaller packaging/alias-pii-entry.py --name alias-pii --onefile \
            --noconfirm --clean --collect-all transformers --collect-submodules uvicorn \
            --collect-submodules alias_pii --hidden-import keyring.backends.macOS
          mkdir -p desktop/src-tauri/binaries
          cp dist/alias-pii desktop/src-tauri/binaries/alias-pii-aarch64-apple-darwin
      - name: Icons, drawn from code
        working-directory: desktop
        run: |
          npm ci
          uv run --frozen python ../packaging/make_icon.py icon.png
          npx tauri icon icon.png
      - name: Build the app and the .dmg
        working-directory: desktop
        run: |
          npx tauri build --bundles app,dmg -- --locked
          ls -la src-tauri/target/release/bundle/macos src-tauri/target/release/bundle/dmg
          du -sh src-tauri/target/release/bundle/macos/Alias.app
      # The hardened runtime enforces library validation: the bridge executable then cannot load
      # the Python it unpacks (signed apart), and dies at start on a Mac with SIP on. GitHub's
      # macOS machines run with SIP off, so the launch check below would not see it: check the
      # signature flags instead.
      - name: The executables are signed without the hardened runtime
        working-directory: desktop/src-tauri/target/release/bundle/macos/Alias.app/Contents/MacOS
        run: |
          for exe in alias-desktop alias-pii; do
            flags=$(codesign -dv "$exe" 2>&1 | grep -o 'flags=[^ ]*' || true)
            echo "$exe: ${flags:-not signed}"
            if [ -z "$flags" ]; then echo "::error::$exe is not signed"; exit 1; fi
            if [[ "$flags" == *runtime* ]]; then echo "::error::$exe has the hardened runtime"; exit 1; fi
          done
      - name: Launch the app; its bridge answers with the model; quitting stops it
        run: |
          app=desktop/src-tauri/target/release/bundle/macos/Alias.app
          open "$app"
          for i in $(seq 150); do curl -sf localhost:8001/health > health.json && break; sleep 2; done
          cat health.json
          grep -q '"detector":"rules+model"' health.json
          osascript -e 'quit app "Alias"'
          for i in $(seq 30); do curl -sf localhost:8001/health > /dev/null || break; sleep 1; done
          if curl -sf localhost:8001/health; then
            echo "the bridge outlived the app"; pgrep -fl alias-pii || true; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: alias-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
  # Only for a release, after the app passed the launch check above.
  attach:
    needs: macos-app
    if: inputs.release_tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$TAG'"; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alias-macos-dmg
          path: dmg
      - name: Attach the .dmg and its SHA-256 to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dmg
          dmg=$(ls Alias_*_aarch64.dmg)
          [ "$dmg" = "Alias_${TAG#v}_aarch64.dmg" ] || { echo "::error::$dmg does not match $TAG"; exit 1; }
          shasum -a 256 "$dmg" > "$dmg.sha256"
          gh release upload "$TAG" "$dmg" "$dmg.sha256" --clobber --repo "$GITHUB_REPOSITORY"

# Secrets in the repository. gitleaks-action scans only the commits of the event (a pull request,
# or the last push), even with the full history checked out; the second step scans every commit
# of every reference with the gitleaks binary (the same version as pre-commit, checksum
# verified), and the weekly run catches a rule added since a commit was scanned.
name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR commits through the API
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        if: github.event_name != 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Every commit of every reference
        env:
          VERSION: "8.30.1"
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .

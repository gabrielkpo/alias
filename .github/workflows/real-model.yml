# The bridge with the published model, as `alias-pii serve` runs it: the `serve` extra (ONNX
# Runtime, no PyTorch), the model downloaded at its pinned commit, a fictitious text masked and
# restored through the bridge in front of a fake Mistral (tests/test_real_model.py). It downloads
# about 600 MB, so it runs on a GitHub machine when the code it covers changes, weekly, or by hand.
name: Real model
on:
  pull_request:
    paths:
      - "src/alias_pii/**"
      - pyproject.toml
      - uv.lock
      - tests/test_real_model.py
      - Dockerfile.bridge
      - .github/workflows/real-model.yml
  push:
    branches: [main]
    paths:
      - "src/alias_pii/**"
      - pyproject.toml
      - uv.lock
      - tests/test_real_model.py
      - Dockerfile.bridge
      - .github/workflows/real-model.yml
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install the serve extra (no PyTorch)
        run: uv sync --frozen --group dev --extra serve --python 3.12
      - name: The command is installed
        run: uv run --frozen alias-pii --help
      - name: Published model through the bridge
        env:
          ALIAS_REAL_MODEL: "1"
        run: uv run --frozen pytest -q tests/test_real_model.py

  docker-bridge:
    # The bridge image: built with the model inside, then run with no network at all, so the
    # container proves it needs nothing from outside and that Mistral is never reached here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        run: docker build -f Dockerfile.bridge -t alias-bridge:ci .
      - name: Run offline and check the token, the detector and the masking path
        run: |
          token=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          docker run -d --name bridge --network none \
            -e MISTRAL_API_KEY=not-a-real-key -e ALIAS_TOKEN="$token" alias-bridge:ci
          call() {
            docker exec -e TOKEN="$1" bridge python -c "
          import json, os, urllib.request, urllib.error
          body = json.dumps({'model': 'm', 'messages': [{'role': 'user', 'content': 'Bonjour Jean Dupont'}]}).encode()
          headers = {'content-type': 'application/json'}
          if os.environ['TOKEN']: headers['authorization'] = 'Bearer ' + os.environ['TOKEN']
          request = urllib.request.Request('http://127.0.0.1:8001/v1/chat/completions', body, headers)
          try: print(urllib.request.urlopen(request, timeout=60).status)
          except urllib.error.HTTPError as e: print(e.code)"
          }
          for i in $(seq 60); do
            docker exec bridge python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)" && break
            sleep 3
          done
          docker exec bridge python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8001/health')))" | tee health.txt
          grep -q "rules+model" health.txt
          test "$(call '')" = 401          # no token: refused before anything is read
          test "$(call "$token")" = 502    # token accepted, text masked, Mistral unreachable
          if docker logs bridge 2>&1 | grep -q "$token"; then echo "token in the logs"; exit 1; fi
          docker rm -f bridge

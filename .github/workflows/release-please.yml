name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflow, so the required checks would never
      # run on the release PR: without RELEASE_PLEASE_TOKEN (a fine-grained PAT, contents + pull
      # requests read/write on this repo only), fail loudly instead of falling back to
      # GITHUB_TOKEN (an expired token already fails in the action itself).
      - name: Check the release token
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set: release PRs would run no checks"; exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # A published release deploys the demo at that tag (the public demo changes only with a release).
  deploy-space:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-space.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}  # this one only, not the release token
  # A published release also gets the macOS app, built and checked at that tag.
  macos-app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write  # the .dmg's build provenance
      attestations: write
    uses: ./.github/workflows/macos-app.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
